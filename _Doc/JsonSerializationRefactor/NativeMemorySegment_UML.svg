<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220" role="img" aria-label="Shared-memory Segment — class architecture"><title>Shared-memory Segment — class architecture</title><rect width="100%" height="100%" fill="#fff"/><defs><marker id="NativeMemorySegment_UML-inherit" markerWidth="15" markerHeight="15" refX="14" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L14 7.5 L1 14 Z" fill="white" stroke="#26394c" stroke-width="1.7"/></marker><marker id="NativeMemorySegment_UML-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#26394c" stroke-width="1.7"/></marker></defs><text x="900.0" y="44" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold" font-size="28" fill="#17314f">Shared-memory Segment — class architecture</text><text x="900.0" y="76" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#56667a">PK.PkUtils.NativeMemory • versioned JSON above unchanged native transport</text><polyline points="460,450 460,333" fill="none" stroke="#26394c" stroke-width="2" marker-end="url(#NativeMemorySegment_UML-inherit)"/><polyline points="850,490 930,490 930,255 1030,255" fill="none" stroke="#26394c" stroke-width="2" marker-end="url(#NativeMemorySegment_UML-arrow)"/><text x="855" y="300" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#334e68" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">static registry</text><polyline points="850,570 1030,570" fill="none" stroke="#26394c" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#NativeMemorySegment_UML-arrow)"/><text x="865" y="555" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#334e68" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">configures</text><polyline points="1370,435 1370,297" fill="none" stroke="#26394c" stroke-width="2" marker-end="url(#NativeMemorySegment_UML-arrow)"/><text x="1390" y="350" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#334e68" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">_registry : 1</text><polyline points="850,705 930,705 930,840 1030,840" fill="none" stroke="#26394c" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#NativeMemorySegment_UML-arrow)"/><text x="860" y="815" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#334e68" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">creates / validates</text><rect x="70" y="120" width="780" height="213" rx="4" fill="#eef3fb" stroke="#3e6592" stroke-width="1.8"/><line x1="70" y1="186" x2="850" y2="186" stroke="#3e6592"/><text x="460.0" y="147" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="bold" fill="#17314f">BaseSegment</text><text x="460.0" y="172" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-style="italic" fill="#56667a">existing concrete class • native transport</text><text x="87" y="212" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#1d3550">+ BufferEffectiveSize : int</text><text x="87" y="239" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#1d3550">+ AcquireLock(millisecondsTimeout : int) : IDisposable</text><text x="87" y="266" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#1d3550"># CopyStreamToSharedMemory(stream) : void</text><text x="87" y="293" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#1d3550"># CopySharedMemoryToStream(stream) : void</text><text x="87" y="320" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#1d3550"># CheckBufferEffectiveSize(neededSize : long) : void</text><rect x="70" y="450" width="780" height="294" rx="4" fill="#eff7ee" stroke="#487740" stroke-width="1.8"/><line x1="70" y1="516" x2="850" y2="516" stroke="#487740"/><text x="460.0" y="477" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="bold" fill="#17314f">Segment</text><text x="460.0" y="502" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-style="italic" fill="#56667a">concrete class • preserves object-oriented API</text><text x="87" y="542" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#1d3550">+ RegisterType&lt;T&gt;(discriminator) : void {static}</text><text x="87" y="569" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#1d3550">+ RegisterType(type, discriminator) : void {static}</text><text x="87" y="596" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#1d3550">+ GetData() : object</text><text x="87" y="623" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#1d3550">+ SetData(obj : object) : void</text><text x="87" y="650" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#1d3550"># ObjectToStream(obj) : MemoryStream {static}</text><text x="87" y="677" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#1d3550"># ObjectFromStream(stream) : object {static}</text><text x="87" y="704" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#1d3550">- _objectTypeRegistry : JsonObjectTypeRegistry {static}</text><text x="87" y="731" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#1d3550">- _serializerOptions : JsonSerializerOptions {static}</text><rect x="1030" y="165" width="680" height="132" rx="4" fill="#f3effa" stroke="#7958a0" stroke-width="1.8"/><line x1="1030" y1="231" x2="1710" y2="231" stroke="#7958a0"/><text x="1370.0" y="192" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="bold" fill="#17314f">JsonObjectTypeRegistry</text><text x="1370.0" y="217" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-style="italic" fill="#56667a">separate Segment registry • initially empty</text><text x="1047" y="257" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#1d3550">Application registers allowed runtime payload types.</text><text x="1047" y="284" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#1d3550">Both processes register the same stable discriminator.</text><rect x="1030" y="435" width="680" height="159" rx="4" fill="#fbefed" stroke="#a25a4b" stroke-width="1.8"/><line x1="1030" y1="501" x2="1710" y2="501" stroke="#a25a4b"/><text x="1370.0" y="462" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="bold" fill="#17314f">RegisteredObjectJsonConverter</text><text x="1370.0" y="487" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-style="italic" fill="#56667a">internal sealed class • reusable converter</text><text x="1047" y="527" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#1d3550">- _registry : JsonObjectTypeRegistry</text><text x="1047" y="554" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#1d3550">+ Read(ref reader, typeToConvert, options) : object</text><text x="1047" y="581" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#1d3550">+ Write(writer, value, options) : void</text><rect x="1030" y="760" width="680" height="159" rx="4" fill="#fff7e7" stroke="#a07b36" stroke-width="1.8"/><line x1="1030" y1="826" x2="1710" y2="826" stroke="#a07b36"/><text x="1370.0" y="787" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="bold" fill="#17314f">SegmentJsonEnvelope</text><text x="1370.0" y="812" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-style="italic" fill="#56667a">private sealed nested class in Segment</text><text x="1047" y="852" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#1d3550">+ Format : string → &quot;$format&quot;</text><text x="1047" y="879" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#1d3550">+ Version : int → &quot;$version&quot;</text><text x="1047" y="906" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#1d3550">+ Data : object → &quot;$data&quot;</text><text x="70" y="1015" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#56667a">Protocol: &quot;$format&quot; = &quot;PK.PkUtils.SharedMemory.Json&quot;; &quot;$version&quot; = 1.</text><text x="70" y="1050" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#56667a">Data is encoded as a registered $type / $value object. Errors preserve their cause in SharedMemoryException.</text><text x="70" y="1085" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#56667a">Buffer capacity, mapping, attachment and named mutex behavior remain responsibilities of BaseSegment.</text><text x="70" y="1120" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#56667a">Registration is local to each process. Older binary participants cannot exchange these JSON payloads.</text><line x1="40" y1="1162" x2="1760" y2="1162" stroke="#dbe3ed"/><text x="40" y="1194" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#56667a">+ public   # protected   ~ internal   - private   {static} static member; selected members only</text></svg>