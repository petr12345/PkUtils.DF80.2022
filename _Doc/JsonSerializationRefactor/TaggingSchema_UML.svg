nt-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">identifier type in class-based schemas</text><polyline points="870,916 1040,916" fill="none" stroke="#26394c" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#TaggingSchema_UML-arrow)"/><text x="880" y="900" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#334e68" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">[JsonConverter]</text><rect x="70" y="130" width="800" height="132" rx="4" fill="#eff7ee" stroke="#487740" stroke-width="1.8"/><line x1="70" y1="196" x2="870" y2="196" stroke="#487740"/><text x="470.0" y="157" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="bold" fill="#17314f">TaggingSchemaJson&lt;TFIELDID&gt;</text><text x="470.0" y="182" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-style="italic" fill="#56667a">internal static class • PK.TestTgSchema.TextBoxCtrls</text><text x="87" y="222" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#1d3550">~ Read(stream : Stream) : SubstLogData&lt;TFIELDID&gt; {static}</text><text x="87" y="249" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#1d3550">~ Write(stream, source) : void {static}</text><rect x="70" y="480" width="800" height="186" rx="4" fill="#fff7e7" stroke="#a07b36" stroke-width="1.8"/><line x1="70" y1="546" x2="870" y2="546" stroke="#a07b36"/><text x="470.0" y="507" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="bold" fill="#17314f">SchemaData</text><text x="470.0" y="532" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-style="italic" fill="#56667a">nested class in TaggingSchemaJson&lt;TFIELDID&gt;</text><text x="87" y="572" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#1d3550">+ Format : string</text><text x="87" y="599" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#1d3550">+ Version : int</text><text x="87" y="626" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#1d3550">+ Text : string</text><text x="87" y="653" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#1d3550">+ Fields : List&lt;FieldData&gt;</text><rect x="1040" y="500" width="690" height="132" rx="4" fill="#fff7e7" stroke="#a07b36" stroke-width="1.8"/><line x1="1040" y1="566" x2="1730" y2="566" stroke="#a07b36"/><text x="1385.0" y="527" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="bold" fill="#17314f">FieldData</text><text x="1385.0" y="552" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-style="italic" fill="#56667a">nested class in TaggingSchemaJson&lt;TFIELDID&gt;</text><text x="1057" y="592" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#1d3550">+ Identifier : TFIELDID</text><text x="1057" y="619" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#1d3550">+ Position : int</text><rect x="70" y="840" width="800" height="132" rx="4" fill="#eff7ee" stroke="#487740" stroke-width="1.8"/><line x1="70" y1="906" x2="870" y2="906" stroke="#487740"/><text x="470.0" y="867" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="bold" fill="#17314f">FieldTypeId</text><text x="470.0" y="892" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-style="italic" fill="#56667a">public class • PK.TestTgSchema</text><text x="87" y="932" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#1d3550">Inherits NodeSerializer&lt;Type&gt;.</text><text x="87" y="959" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#1d3550">JSON converter attribute: FieldTypeIdJsonConverter.</text><rect x="1040" y="820" width="690" height="159" rx="4" fill="#fbefed" stroke="#a25a4b" stroke-width="1.8"/><line x1="1040" y1="886" x2="1730" y2="886" stroke="#a25a4b"/><text x="1385.0" y="847" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="bold" fill="#17314f">FieldTypeIdJsonConverter</text><text x="1385.0" y="872" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-style="italic" fill="#56667a">sealed • JsonConverter&lt;FieldTypeId&gt;</text><text x="1057" y="912" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#1d3550">- _types : Dictionary&lt;string, Type&gt; {static}</text><text x="1057" y="939" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#1d3550">+ Read(ref reader, typeToConvert, options) : FieldTypeId</text><text x="1057" y="966" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#1d3550">+ Write(writer, value, options) : void</text><text x="70" y="1070" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#56667a">JSON schema format: &quot;PK.TaggingSchema.Json&quot;; Version = 1.</text><text x="70" y="1105" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#56667a">Only logical text and ordered field identifiers/positions are persisted; the receiving control supplies its map.</text><text x="70" y="1140" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#56667a">Enum-based schemas use the enum directly. Class-based schemas use stable field discriminators.</text><text x="70" y="1175" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#56667a">Old binary tagging files are not interpreted by the new JSON option. XML and plain text options remain.</text><line x1="40" y1="1202" x2="1760" y2="1202" stroke="#dbe3ed"/><text x="40" y="1234" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#56667a">+ public   # protected   ~ internal   - private   {static} static member; selected members only</text></svg>